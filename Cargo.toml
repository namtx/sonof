[package]
name = "sonof"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
indicatif = "0.17"
dirs = "5.0"
base64 = "0.22"
futures-util = "0.3"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
ab_glyph = "0.2"
